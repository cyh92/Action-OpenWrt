name: Build Fanchmwrt OpenWrt
on:
  workflow_dispatch: # 手动触发，推荐

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FanchmWrt source code
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4 # 默认分支，可按需修改
          fetch-depth: 0 # 完整克隆，feeds更新必须
          path: fanchmwrt # 源码放在 fanchmwrt 目录

      - name: Update apt & install build dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils bzip2 diffutils findutils flex gawk gcc g++ gettext grep install-info libc6-dev zlib1g-dev libncurses-dev make perl python3 python3-setuptools python3-dev python3.12-distutils rsync subversion unzip debianutils swig ncurses-term

      - name: Verify all build tools
        run: |
          check() {
            if command -v $1 >/dev/null 2>&1; then echo "✅ $1 ok"; else echo "❌ $1 missing"; exit 1; fi
          }
          check ld
          check bzip2
          check diff
          check find
          check flex
          check gawk
          check gcc
          check getopt
          check grep
          check make
          check perl
          check python3
          check rsync
          check svn
          check unzip
          check which
          check swig
          python3 -c "import distutils.util; print('✅ distutils OK')"

      - name: Run OpenWrt prerequisite check (make prereq)
        working-directory: ./fanchmwrt
        run: make prereq

      - name: Update feeds
        working-directory: ./fanchmwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: ./fanchmwrt
        run: |
          make defconfig
          # 如果你有自己的配置，可以上传.config到本仓库，然后：
          # cp ../.config .config

      - name: Compile firmware
        working-directory: ./fanchmwrt
        run: |
          make -j$(nproc) || make -j1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        working-directory: ./fanchmwrt
        with:
          name: fanchmwrt-firmware
          path: bin/targets/**/*.bin
