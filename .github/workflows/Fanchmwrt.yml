name: Build Fanchmwrt OpenWrt
on:
  workflow_dispatch: # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FanchmWrt source code
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
          fetch-depth: 0
          path: fanchmwrt

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y >
            binutils bzip2 diffutils findutils flex gawk gcc g++ gettext grep
            install-info libc6-dev zlib1g-dev libncurses-dev make perl python3
            python3-setuptools python3-dev python3.12-distutils rsync subversion
            unzip debianutils swig ncurses-term

      - name: Verify build tools
        run: |
          check() {
            if command -v "$1" >/dev/null 2>&1; then
              echo "✅ $1 ok"
            else
              echo "❌ $1 missing"
              exit 1
            fi
          }
          check ld
          check bzip2
          check diff
          check find
          check flex
          check gawk
          check gcc
          check getopt
          check grep
          check make
          check perl
          check python3
          check rsync
          check svn
          check unzip
          check which
          check swig
          python3 -c "import distutils.util; print('✅ distutils OK')"

      - name: Prereq check
        working-directory: ./fanchmwrt
        run: make prereq

      - name: Update & install feeds
        working-directory: ./fanchmwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: ./fanchmwrt
        run: |
          make defconfig
          # 如果你有自定义配置文件，放到本仓库根目录，取消下面这行注释
          # cp ../my_device.config .config

      - name: Compile firmware
        working-directory: ./fanchmwrt
        run: |
          make -j$(nproc) || make -j1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-firmware
          path: ./fanchmwrt/bin/targets/**/*.bin
